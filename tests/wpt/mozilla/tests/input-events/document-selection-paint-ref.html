<!doctype html>
<meta charset="utf-8">
<title>Reference for wrapped document selection</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
  body { margin: 0; }
  p { position: relative; margin: 0; width: 7ch; font: 20px/24px Ahem; }
  .highlight { position: absolute; background: rgb(176, 214, 255); height: 24px; }
  .first { top: 0; left: 20px; width: 120px; }
  .second { top: 24px; left: 0; width: 60px; }
  .text { position: relative; }
</style>
<p><span class="highlight first"></span><span class="highlight second"></span><span class="text">abc def ghi jkl</span></p>
